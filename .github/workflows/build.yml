name: Build and check desktop pet
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Get matching Godot editor
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .tools/godot | Out-Null
          Invoke-WebRequest 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip' -OutFile .tools/godot.zip
          Expand-Archive .tools/godot.zip .tools/godot
      - name: Build native debug and release
        shell: pwsh
        run: |
          ./tools/build_native.ps1 -Godot "$pwd/.tools/godot/Godot_v4.7.2-stable_win64_console.exe"
          ./tools/build_native.ps1 -Godot "$pwd/.tools/godot/Godot_v4.7.2-stable_win64_console.exe" -Target template_release
      - name: Run checks
        shell: pwsh
        run: |
          $output = & .tools/godot/Godot_v4.7.2-stable_win64_console.exe --headless --editor --path . --import --quit 2>&1
          $output | Write-Output
          if ($LASTEXITCODE -ne 0 -or ($output -match 'SCRIPT ERROR|^ERROR:')) { throw "Godot import failed" }
      - name: Export Windows build
        shell: pwsh
        run: |
          python tools/fetch_templates.py --platform windows --output .tools/export_templates/4.7.2.stable
          New-Item -ItemType Directory -Force build/windows | Out-Null
          & .tools/godot/Godot_v4.7.2-stable_win64_console.exe --headless --path . --export-release 'Windows Desktop'
          if ($LASTEXITCODE -ne 0) { throw 'Windows export failed' }
          Copy-Item docs/THIRD_PARTY_NOTICES.txt,docs/QUICKSTART.zh-CN.txt build/windows/
      - uses: actions/upload-artifact@v4
        with:
          name: minispaceman-windows-x64
          path: build/windows/

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Get matching Godot editor
        run: |
          mkdir -p .tools/godot
          curl -fL --retry 3 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_macos.universal.zip' -o .tools/godot.zip
          unzip -q .tools/godot.zip -d .tools/godot
          echo "GODOT_BIN=$PWD/.tools/godot/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
      - name: Build native debug and release
        run: |
          bash tools/build_native.sh
          TARGET=template_release bash tools/build_native.sh
      - name: Run checks
        run: |
          "$GODOT_BIN" --headless --editor --path . --import --quit > "$RUNNER_TEMP/godot-import.log" 2>&1
          cat "$RUNNER_TEMP/godot-import.log"
          ! rg -n 'SCRIPT ERROR|^ERROR:' "$RUNNER_TEMP/godot-import.log"
      - name: Export macOS Universal build
        run: |
          python tools/fetch_templates.py --platform macos --output .tools/export_templates/4.7.2.stable
          mkdir -p build/macos
          "$GODOT_BIN" --headless --path . --export-release macOS
          zip -j build/macos/minispaceman.zip docs/THIRD_PARTY_NOTICES.txt docs/QUICKSTART.zh-CN.txt
      - uses: actions/upload-artifact@v4
        with:
          name: minispaceman-macos-universal
          path: build/macos/*.zip
